<title>Mi Agenda</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3edf9; --card:#ffffff; --text:#2e2628; --text2:#8a7a7e;
  --border:#ecdfe1; --accent:#a8647a; --accent-dark:#6b3747; --accent-bg:#f6e4e8;
  --gold:#c3a06a; --ok:#577a3a; --ok-bg:#ecf1e3; --warn:#9a6a2a; --warn-bg:#faf0dd;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#211c2b; --card:#2b2334; --text:#f3e9eb; --text2:#c6b2b7;
    --border:#453a3d; --accent:#e3aabb; --accent-dark:#f3dbe2; --accent-bg:#4a2c34;
    --gold:#d6bb86; --ok:#a7c98a; --ok-bg:#2f3a22; --warn:#e0b26a; --warn-bg:#3e2f17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#211c2b; --card:#2b2334; --text:#f3e9eb; --text2:#c6b2b7;
  --border:#453a3d; --accent:#e3aabb; --accent-dark:#f3dbe2; --accent-bg:#4a2c34;
  --gold:#d6bb86; --ok:#a7c98a; --ok-bg:#2f3a22; --warn:#e0b26a; --warn-bg:#3e2f17;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:740px;margin:0 auto;padding:24px 16px 48px;}
.header{border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:20px;display:flex;align-items:center;gap:12px;}
h1{font-size:22px;font-weight:600;margin:0;color:var(--accent-dark);letter-spacing:.3px;}
.ver{font-size:11px;font-weight:500;color:var(--text2);border:1px solid var(--border);border-radius:20px;padding:2px 8px;vertical-align:middle;}
.sub{color:var(--text2);font-size:13px;margin:0;}
.theme-btn{margin-left:auto;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:7px 12px;font-size:13px;color:var(--text);flex-shrink:0;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;position:relative;}
.stat .n{font-size:19px;font-weight:600;color:var(--accent-dark);}
.stat .l{font-size:11.5px;color:var(--text2);}
.badgeCount{position:absolute;top:-6px;right:-6px;background:var(--warn);color:#fff;font-size:11px;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:20px;}
.card h2{font-size:15px;margin:0 0 12px;color:var(--accent-dark);}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.toolbtns{display:flex;gap:8px;flex-wrap:wrap;}
form{display:grid;gap:10px;grid-template-columns:1fr 1fr;}
form .full{grid-column:1/-1;}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;}
input,select{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;}
button{cursor:pointer;border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:500;}
.btn-add{background:#4d7c32;color:#fff;grid-column:1/-1;}
.btn-cancel{background:var(--bg);border:1px solid var(--border);color:var(--text);grid-column:1/-1;}
.btn-tool{background:var(--card);border:1px solid var(--border);color:var(--accent-dark);}
.btn-danger{background:var(--card);border:1px solid var(--warn);color:var(--warn);}
.reminder{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:6px;}
.turno{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding:10px 0;gap:8px;}
.turno:last-child{border-bottom:none;}
.turno .info b{font-size:14px;}
.turno .info div{font-size:12px;color:var(--text2);}
.badge{font-size:11px;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.badge.pendiente{background:var(--warn-bg);color:var(--warn);}
.badge.atendido{background:var(--ok-bg);color:var(--ok);}
.actions{display:flex;gap:6px;flex-wrap:wrap;}
.actions button{padding:5px 9px;font-size:12px;background:var(--bg);border:1px solid var(--border);color:var(--text);}
.empty{color:var(--text2);font-size:13px;text-align:center;padding:16px 0;}
#lock-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.lock-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;max-width:320px;width:100%;text-align:center;}
.lock-card input{text-align:center;letter-spacing:6px;font-size:20px;padding:10px;margin-bottom:10px;}
.lock-card button{width:100%;margin-top:4px;}
.lock-err{color:var(--warn);font-size:12.5px;min-height:16px;margin-bottom:6px;}
.lock-link{background:none;border:none;color:var(--text2);font-size:12px;text-decoration:underline;padding:6px;margin-top:8px;}
#app{display:none;}
</style>
</head>
<body>

<div id="lock-overlay">
  <div class="lock-card" id="lock-card"></div>
</div>

<div id="app">

<script>
const KEY='turnos_manicura';
const PINKEY='pin_mia';
const TEMAKEY='tema_mia';
const NOTIFKEY='notificados_mia';
const TIPOKEY='tipo_pin_mia';
const BIOKEY='bio_mia';
const FORMATOKEY='formato_hora_mia';
let turnos = JSON.parse(localStorage.getItem(KEY) || '[]');
let confirmandoLimpiar = false;

/* ---------- Tema ---------- */
function aplicarTema(){
  const t = localStorage.getItem(TEMAKEY);
  if(t==='dark'){ document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeBtn').textContent='☀️ Claro'; }
  else if(t==='light'){ document.documentElement.setAttribute('data-theme','light'); document.getElementById('themeBtn').textContent='🌙 Oscuro'; }
  else { document.documentElement.removeAttribute('data-theme'); document.getElementById('themeBtn').textContent='🌓 Tema'; }
}
function toggleTema(){
  const actual = localStorage.getItem(TEMAKEY);
  const sistemaOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  let nuevo;
  if(!actual) nuevo = sistemaOscuro ? 'light' : 'dark';
  else if(actual==='dark') nuevo='light';
  else nuevo='dark';
  localStorage.setItem(TEMAKEY, nuevo);
  aplicarTema();
}
aplicarTema();
aplicarFormato();

/* ---------- PIN / bloqueo ---------- */
function bloquear(){
  document.getElementById('app').style.display='none';
  document.getElementById('lock-overlay').style.display='flex';
  pintarLock();
}
function pintarLock(){
  const card = document.getElementById('lock-card');
  const tipo = localStorage.getItem(TIPOKEY) || 'numeric';
  const attrs = tipo==='numeric' ? 'inputmode="numeric" maxlength="6"' : 'inputmode="text"';
  const bioBtn = localStorage.getItem(BIOKEY)
    ? '<button class="btn-tool" style="width:100%;margin-top:8px" onclick="usarBiometria()">Usar huella / Face unlock</button>'
    : '';
  card.innerHTML = `
    <h2 style="margin-top:0">Mi Agenda</h2>
    <p style="font-size:13px;color:var(--text2)">Ingresa tu contraseña</p>
    <input id="pinEntrada" type="password" ${attrs} placeholder="••••">
    <div class="lock-err" id="lockErr"></div>
    <button class="btn-add" onclick="verificarPin()">Entrar</button>
    ${bioBtn}
    <button class="lock-link" onclick="olvidePin()">Olvidé mi contraseña</button>
  `;
  document.getElementById('pinEntrada').addEventListener('keydown', e=>{ if(e.key==='Enter') verificarPin(); });
}
function crearPin(){
  const tipo = document.getElementById('segTipo').value;
  const p1 = document.getElementById('segPin1').value;
  const p2 = document.getElementById('segPin2').value;
  const err = document.getElementById('segErr');
  if(tipo==='numeric'){
    if(!/^\d{4,6}$/.test(p1)){ err.textContent='Debe tener entre 4 y 6 números.'; return; }
  } else {
    if(p1.length<4 || p1.length>20){ err.textContent='Debe tener entre 4 y 20 caracteres.'; return; }
  }
  if(p1!==p2){ err.textContent='Las contraseñas no coinciden.'; return; }
  localStorage.setItem(PINKEY, p1);
  localStorage.setItem(TIPOKEY, tipo);
  pintarSeguridad();
}
function cambiarTipoSeg(){
  const tipo = document.getElementById('segTipo').value;
  const i1 = document.getElementById('segPin1');
  const i2 = document.getElementById('segPin2');
  if(tipo==='numeric'){
    i1.setAttribute('inputmode','numeric'); i1.setAttribute('maxlength','6');
    i2.setAttribute('inputmode','numeric'); i2.setAttribute('maxlength','6');
  } else {
    i1.setAttribute('inputmode','text'); i1.removeAttribute('maxlength');
    i2.setAttribute('inputmode','text'); i2.removeAttribute('maxlength');
  }
}
async function activarBiometria(){
  if(!window.PublicKeyCredential){ alert('Este navegador no soporta biometría.'); return; }
  try{
    const disponible = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    if(!disponible){ alert('No se detectó huella/Face unlock disponible en este dispositivo.'); return; }
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({ publicKey: {
      challenge, rp:{ name:'Mi Agenda' }, user:{ id:userId, name:'usuaria', displayName:'Mi Agenda' },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required' }, timeout:60000
    }});
    const rawId = new Uint8Array(cred.rawId);
    localStorage.setItem(BIOKEY, btoa(String.fromCharCode(...rawId)));
    pintarSeguridad();
  } catch(e){ alert('No se pudo activar la biometría en este dispositivo.'); }
}
async function usarBiometria(){
  try{
    const idB64 = localStorage.getItem(BIOKEY);
    const rawId = Uint8Array.from(atob(idB64), c=>c.charCodeAt(0));
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({ publicKey: {
      challenge, allowCredentials:[{id:rawId, type:'public-key'}], userVerification:'required', timeout:60000
    }});
    desbloquear();
  } catch(e){
    const err = document.getElementById('lockErr');
    if(err) err.textContent='No se pudo verificar la biometría.';
  }
}
function quitarBiometria(){ localStorage.removeItem(BIOKEY); pintarSeguridad(); }
let confirmandoQuitarPin = false;
function quitarPin(){
  if(!confirmandoQuitarPin){
    confirmandoQuitarPin = true;
    const btn = document.getElementById('btnQuitarPin');
    if(btn) btn.textContent = '¿Seguro? Confirmar';
    setTimeout(()=>{ confirmandoQuitarPin=false; if(btn) btn.textContent='Quitar contraseña'; }, 4000);
    return;
  }
  confirmandoQuitarPin = false;
  localStorage.removeItem(PINKEY);
  localStorage.removeItem(TIPOKEY);
  pintarSeguridad();
}
function pintarSeguridad(){
  const pin = localStorage.getItem(PINKEY);
  const tipo = localStorage.getItem(TIPOKEY) || 'numeric';
  const bio = localStorage.getItem(BIOKEY);
  const box = document.getElementById('seg-box');
  let html = '';
  if(!pin){
    html += `
      <p style="font-size:13px;color:var(--text2);margin-top:0">La app no tiene contraseña. Actívala para protegerla.</p>
      <label>Tipo de contraseña</label>
      <select id="segTipo" onchange="cambiarTipoSeg()" style="margin-bottom:8px">
        <option value="numeric">Numérica (PIN de 4 a 6 dígitos)</option>
        <option value="alnum">Alfanumérica (letras y números)</option>
      </select>
      <input id="segPin1" type="password" inputmode="numeric" maxlength="6" placeholder="Nueva contraseña" style="margin-bottom:8px">
      <input id="segPin2" type="password" inputmode="numeric" maxlength="6" placeholder="Confirmar contraseña" style="margin-bottom:8px">
      <div class="lock-err" id="segErr"></div>
      <button class="btn-tool" onclick="crearPin()">Activar contraseña</button>
    `;
  } else {
    html += `
      <p style="font-size:13px;color:var(--text2);margin-top:0">Contraseña activada (${tipo==='numeric'?'numérica':'alfanumérica'}).</p>
      <button class="btn-tool" onclick="bloquear()">Bloquear ahora</button>
      <button class="btn-danger" id="btnQuitarPin" onclick="quitarPin()">Quitar contraseña</button>
    `;
  }
  html += '<hr style="border:none;border-top:1px solid var(--border);margin:14px 0">';
  if(bio){
    html += `<p style="font-size:13px;color:var(--text2)">Desbloqueo biométrico activado.</p>
      <button class="btn-danger" onclick="quitarBiometria()">Desactivar biometría</button>`;
  } else {
    html += `<p style="font-size:13px;color:var(--text2)">Activa huella o Face unlock si tu dispositivo lo soporta (además de la contraseña).</p>
      <button class="btn-tool" onclick="activarBiometria()">Activar biometría</button>`;
  }
  box.innerHTML = html;
}
function verificarPin(){
  const p = document.getElementById('pinEntrada').value.trim();
  const err = document.getElementById('lockErr');
  if(p === localStorage.getItem(PINKEY)){ desbloquear(); }
  else { err.textContent='Contraseña incorrecta.'; }
}
function olvidePin(){
  if(confirm('Esto borrará la contraseña (tus turnos NO se borran). ¿Continuar?')){
    localStorage.removeItem(PINKEY);
    pintarLock();
  }
}
function desbloquear(){
  document.getElementById('lock-overlay').style.display='none';
  document.getElementById('app').style.display='block';
  render();
  pintarSeguridad();
  pedirNotificaciones();
}
if(localStorage.getItem(PINKEY)){ pintarLock(); } else { desbloquear(); }

/* ---------- Datos ---------- */
function save(){ localStorage.setItem(KEY, JSON.stringify(turnos)); render(); }
function money(n){ return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n); }
function fmtFecha(f){ const [y,m,d]=f.split('-'); return `${d}/${m}/${y}`; }
function fmtHora(h){
  const formato = localStorage.getItem(FORMATOKEY) || '24';
  if(formato==='24') return h;
  let [hh,mm] = h.split(':').map(Number);
  const ampm = hh>=12 ? 'p.m.' : 'a.m.';
  hh = hh % 12; if(hh===0) hh = 12;
  return `${hh}:${String(mm).padStart(2,'0')} ${ampm}`;
}
function guardarFormato(){
  localStorage.setItem(FORMATOKEY, document.getElementById('formatoHora').value);
  render();
}
function aplicarFormato(){
  document.getElementById('formatoHora').value = localStorage.getItem(FORMATOKEY) || '24';
}

function render(){
  const pendientes = turnos.filter(t=>t.estado==='pendiente');
  const atendidos = turnos.filter(t=>t.estado==='atendido');
  const ingresos = atendidos.reduce((s,t)=>s+Number(t.costo),0);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${turnos.length}</div><div class="l">Clientes ingresados</div></div>
    <div class="stat">${pendientes.length?`<div class="badgeCount">${pendientes.length}</div>`:''}<div class="n">${pendientes.length}</div><div class="l">Por agendar/atender</div></div>
    <div class="stat"><div class="n">${atendidos.length}</div><div class="l">Atendidos</div></div>
    <div class="stat"><div class="n">${money(ingresos)}</div><div class="l">Ingresos</div></div>
  `;

  const now = new Date();
  const en48h = pendientes.filter(t=>{
    const dt = new Date(t.fecha+'T'+t.hora);
    const diffH = (dt-now)/3600000;
    return diffH >= -1 && diffH <= 48;
  });
  const remCard = document.getElementById('reminders-card');
  if(en48h.length){
    remCard.style.display='block';
    document.getElementById('reminders').innerHTML = en48h.map(t=>
      `<div class="reminder">${t.cliente} · ${t.servicio} · ${fmtFecha(t.fecha)} ${fmtHora(t.hora)}</div>`
    ).join('');
  } else { remCard.style.display='none'; }

  const lista = document.getElementById('lista');
  if(!turnos.length){ lista.innerHTML='<div class="empty">Aún no hay turnos registrados.</div>'; return; }
  lista.innerHTML = turnos.map(t=>`
    <div class="turno">
      <div class="info">
        <b>${t.cliente}</b> — ${t.servicio}
        <div>${fmtFecha(t.fecha)} · ${fmtHora(t.hora)} · <span style="cursor:pointer;text-decoration:underline dotted;" onclick="editarCostoRapido('${t.id}', ${t.costo||0})" title="Tocar para editar el costo">${t.costo ? money(t.costo) : 'Costo pendiente'} ✎</span></div>
      </div>
      <div class="actions">
        <span class="badge ${t.estado}">${t.estado}</span>
        <button onclick="editar('${t.id}')">Editar</button>
        ${t.estado==='pendiente' ? `<button onclick="marcar('${t.id}')">Atendido</button>` : ''}
        <button onclick="eliminar('${t.id}')">Eliminar</button>
      </div>
    </div>
  `).join('');

  checarNotificaciones(en48h);
}

function editarCostoRapido(id, actual){
  const val = prompt('Nuevo costo del servicio:', actual || '');
  if(val===null) return;
  const num = Number(val);
  if(isNaN(num) || num<0){ alert('Ingresa un número válido.'); return; }
  turnos = turnos.map(t=> t.id===id ? {...t, costo:num} : t);
  save();
}
function marcar(id){ turnos = turnos.map(t=> t.id===id ? {...t, estado:'atendido'} : t); save(); }
function eliminar(id){ turnos = turnos.filter(t=>t.id!==id); save(); }

function editar(id){
  const t = turnos.find(x=>x.id===id);
  if(!t) return;
  document.getElementById('editId').value = t.id;
  document.getElementById('cliente').value = t.cliente;
  document.getElementById('servicio').value = t.servicio;
  document.getElementById('fecha').value = t.fecha;
  document.getElementById('hora').value = t.hora;
  document.getElementById('costo').value = t.costo;
  document.getElementById('estado').value = t.estado;
  document.getElementById('form-title').textContent = 'Editar turno';
  document.getElementById('btnSubmit').textContent = 'Guardar cambios';
  document.getElementById('btnCancel').style.display = 'inline-block';
  document.getElementById('form').scrollIntoView({behavior:'smooth'});
}

function cancelarEdicion(){
  document.getElementById('form').reset();
  document.getElementById('editId').value = '';
  document.getElementById('form-title').textContent = 'Nuevo turno';
  document.getElementById('btnSubmit').textContent = 'Agregar turno';
  document.getElementById('btnCancel').style.display = 'none';
}

document.getElementById('form').addEventListener('submit', e=>{
  e.preventDefault();
  const id = document.getElementById('editId').value;
  const cliente = document.getElementById('cliente').value.trim();
  const servicio = document.getElementById('servicio').value.trim();
  const fecha = document.getElementById('fecha').value;
  const hora = document.getElementById('hora').value;
  const costoRaw = document.getElementById('costo').value;
  const costo = costoRaw === '' ? 0 : Number(costoRaw);
  const estado = document.getElementById('estado').value;
  if(!cliente||!servicio||!fecha||!hora){ return; }

  if(id){
    turnos = turnos.map(t=> t.id===id ? {...t, cliente, servicio, fecha, hora, costo, estado} : t);
  } else {
    turnos.push({id:Date.now().toString(), cliente, servicio, fecha, hora, costo, estado});
  }
  cancelarEdicion();
  save();
});

function limpiarTodo(){
  const btn = document.getElementById('btnLimpiar');
  if(!confirmandoLimpiar){
    confirmandoLimpiar = true;
    btn.textContent = '¿Seguro? Confirmar';
    setTimeout(()=>{ confirmandoLimpiar=false; btn.textContent='Limpiar datos'; }, 4000);
    return;
  }
  turnos = [];
  confirmandoLimpiar = false;
  btn.textContent = 'Limpiar datos';
  save();
}

function exportarExcel(){
  const datos = turnos.map(t=>({
    Cliente: t.cliente, Servicio: t.servicio, Fecha: fmtFecha(t.fecha),
    Hora: t.hora, Costo: Number(t.costo), Estado: t.estado
  }));
  const ws = XLSX.utils.json_to_sheet(datos);
  ws['!cols'] = [{wch:18},{wch:20},{wch:12},{wch:8},{wch:12},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Mi Agenda');
  XLSX.writeFile(wb, 'Mi_Agenda.xlsx');
}

/* ---------- Notificaciones ---------- */
function pedirNotificaciones(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission();
  }
}
function checarNotificaciones(en48h){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  let notificados = JSON.parse(localStorage.getItem(NOTIFKEY) || '[]');
  en48h.forEach(t=>{
    if(!notificados.includes(t.id)){
      new Notification('Turno pendiente - Mi Agenda', {
        body: `${t.cliente} · ${t.servicio} · ${fmtFecha(t.fecha)} ${fmtHora(t.hora)}`
      });
      notificados.push(t.id);
    }
  });
  notificados = notificados.filter(id => turnos.some(t=>t.id===id));
  localStorage.setItem(NOTIFKEY, JSON.stringify(notificados));
}
setInterval(()=>{ if(document.getElementById('app').style.display!=='none') render(); }, 5*60*1000);
</script>
</body>
